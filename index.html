<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xynergie Daily Ops Checklist v2</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf2;--text2:#8b90a8;--text3:#555b74;
  --accent:#4f9cf9;--adim:rgba(79,156,249,0.12);
  --green:#3ecf8e;--gdim:rgba(62,207,142,0.12);
  --amber:#f5a623;--qdim:rgba(245,166,35,0.12);
  --purple:#a78bfa;--pdim:rgba(167,139,250,0.12);
  --red:#f56565;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --mono:'Courier New',Courier,monospace;
  --r:8px;--rl:12px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.shell{max-width:900px;margin:0 auto;padding:2rem 1.5rem 4rem}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.75rem;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.logo-txt{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--text2);text-transform:uppercase}
.page-title{font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.02em}
.date-lbl{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:3px}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.user-badge{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:99px;padding:5px 12px 5px 8px}
.user-avatar{width:22px;height:22px;border-radius:50%;background:var(--adim);border:1px solid rgba(79,156,249,0.3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent)}
.user-name{font-family:var(--mono);font-size:11px;color:var(--text2)}
.header-btns{display:flex;gap:8px}
.reset-btn{font-family:var(--mono);font-size:11px;color:var(--text3);background:none;border:1px solid var(--border2);border-radius:var(--r);padding:5px 12px;cursor:pointer}
.reset-btn:hover{color:var(--text2)}
.save-btn{font-family:var(--mono);font-size:11px;color:#0f1117;background:var(--green);border:none;border-radius:var(--r);padding:5px 14px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:6px}
.save-btn:hover{opacity:0.88}
.save-btn:disabled{opacity:0.45;cursor:not-allowed}
.save-status{font-family:var(--mono);font-size:10px;text-align:right;min-height:14px}
.save-status.ok{color:var(--green)}
.save-status.err{color:var(--red)}
.save-status.ing{color:var(--accent)}
.prog-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:14px}
.prog-lbl{font-family:var(--mono);font-size:11px;color:var(--text3);white-space:nowrap}
.prog-track{flex:1;height:4px;background:var(--border2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width 0.3s}
.prog-count{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;min-width:48px;text-align:right}
.section{margin-bottom:1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.sec-hdr{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
.sec-pill{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;flex-shrink:0}
.pill-edr{background:var(--adim);color:var(--accent)}
.pill-hunt{background:var(--gdim);color:var(--green)}
.pill-tkt{background:var(--qdim);color:var(--amber)}
.pill-mail{background:var(--pdim);color:var(--purple)}
.pill-rep{background:var(--gdim);color:var(--green)}
.pill-upd{background:var(--adim);color:var(--accent)}
.pill-log{background:var(--pdim);color:var(--purple)}
.sec-title{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:0.04em;flex:1}
.sec-badge{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--border2);color:var(--text3)}
.sec-badge.done{color:var(--green);border-color:rgba(62,207,142,0.35);background:var(--gdim)}
.task{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.task:last-child{border-bottom:none}
.task:hover{background:rgba(255,255,255,0.025)}
.cb{width:18px;height:18px;flex-shrink:0;border:2px solid var(--border2);border-radius:4px;display:flex;align-items:center;justify-content:center}
.cb.on{background:var(--gdim);border-color:var(--green)}
.ck{display:none}
.cb.on .ck{display:block}
.tt{font-size:13.5px;color:var(--text);flex:1;line-height:1.4}
.tt.on{color:var(--text3);text-decoration:line-through}
.task-tag{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:99px;flex-shrink:0}
.t-sec{background:var(--adim);color:var(--accent)}
.t-tkt{background:var(--qdim);color:var(--amber)}
.t-rep{background:var(--gdim);color:var(--green)}
.t-log{background:var(--pdim);color:var(--purple)}
.notes-section{margin-bottom:1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.notes-hdr{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
.notes-hdr-icon{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--pdim);color:var(--purple);flex-shrink:0}
.notes-hdr-title{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:0.04em;flex:1}
.notes-count{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--border2);color:var(--text3)}
.notes-input-wrap{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.note-cat-sel{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text2);font-family:var(--mono);font-size:11px;padding:7px 8px;cursor:pointer;outline:none;flex-shrink:0}
.note-cat-sel option{background:var(--surface2);color:var(--text)}
.notes-textarea{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font);font-size:13px;padding:8px 10px;resize:none;min-height:62px;outline:none;line-height:1.5}
.notes-textarea:focus{border-color:rgba(79,156,249,0.5)}
.notes-add-btn{background:var(--adim);border:1px solid rgba(79,156,249,0.35);border-radius:var(--r);color:var(--accent);font-family:var(--mono);font-size:11px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.note-item{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.note-item:last-child{border-bottom:none}
.note-time{font-family:var(--mono);font-size:10px;color:var(--accent);flex-shrink:0;min-width:52px;margin-top:2px}
.note-body{font-size:13px;color:var(--text);line-height:1.5;flex:1;word-break:break-word}
.note-cat-badge{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:99px;flex-shrink:0;margin-top:2px}
.nc-general{background:var(--pdim);color:var(--purple)}
.nc-huntress{background:var(--gdim);color:var(--green)}
.nc-datto{background:var(--adim);color:var(--accent)}
.nc-ticket{background:var(--qdim);color:var(--amber)}
.note-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;flex-shrink:0;padding:0}
.note-del:hover{color:var(--red)}
.empty-notes{padding:16px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text3)}
.footer{margin-top:2rem;text-align:center;font-family:var(--mono);font-size:10px;color:var(--text3)}
@media(max-width:600px){.shell{padding:1.25rem 1rem 3rem}.task-tag,.note-cat-badge{display:none}.page-title{font-size:18px}}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div>
      <div class="logo"><div class="dot"></div><span class="logo-txt">Xynergie Corp</span></div>
      <div class="page-title">Daily Ops Checklist</div>
      <div class="date-lbl" id="dl"></div>
    </div>
    <div class="header-right">
      <div class="user-badge">
        <div class="user-avatar" id="user-avatar">--</div>
        <span class="user-name" id="user-name">Not signed in</span>
      </div>
      <div class="header-btns">
        <button class="reset-btn" id="resetBtn">&#8635; reset day</button>
        <button class="save-btn" id="saveBtn" disabled>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 10h8M6 2v6M3.5 5.5L6 8l2.5-2.5" stroke="#0f1117" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Save Log
        </button>
      </div>
      <div class="save-status" id="save-status"></div>
    </div>
  </div>
  <div class="prog-wrap">
    <span class="prog-lbl">PROGRESS</span>
    <div class="prog-track"><div class="prog-fill" id="pf"></div></div>
    <span class="prog-count" id="pc">0 / 0</span>
  </div>
  <div id="app"></div>
  <div class="notes-section">
    <div class="notes-hdr">
      <span class="notes-hdr-icon">NOTES</span>
      <span class="notes-hdr-title">Daily Notes</span>
      <span class="notes-count" id="notes-count">0 notes</span>
    </div>
    <div class="notes-input-wrap">
      <select class="note-cat-sel" id="note-cat">
        <option value="general">General</option>
        <option value="huntress">Huntress</option>
        <option value="datto">Datto</option>
        <option value="ticket">Ticket</option>
      </select>
      <textarea class="notes-textarea" id="note-input" placeholder="e.g. Huntress flagged suspicious login on DESKTOP-04 — created ticket #1042, monitoring for recurrence..."></textarea>
      <button class="notes-add-btn" id="note-add-btn">+ log</button>
    </div>
    <div id="notes-list"></div>
  </div>
  <div class="footer">auto-resets daily &middot; progress saved in browser &middot; xynergie msp ops</div>
</div>

<script>
// ---- CONFIG ----
var CLIENT_ID   = '33792a35-4af8-4fbb-8c46-c2b19c702a62';
var TENANT_ID   = 'd5a2e3df-bdc3-4c0f-8fd4-908cd7751d67';
var SITE_URL    = 'https://xynergieholdings.sharepoint.com/sites/itops';
var FOLDER_PATH = 'Daily Logs';

var SKEY = 'xyn_cl_v3', DKEY = 'xyn_cl_date', NKEY = 'xyn_notes_v3';

var DATA = [
  { title:'Datto EDR', pill:'EDR', pillClass:'pill-edr', tasks:[
    {t:'Review Datto EDR alert queue — triage new detections', c:'sec'},
    {t:'Investigate any active or flagged endpoint threats', c:'sec'},
    {t:'Confirm all managed devices are reporting in', c:'sec'},
    {t:'Clear or escalate resolved alerts', c:'sec'}
  ]},
  { title:'Huntress (EDR / ITDR / SAT)', pill:'HUNT', pillClass:'pill-hunt', tasks:[
    {t:'Check Huntress dashboard for new incident reports', c:'sec'},
    {t:'Review ITDR — inspect identity threat detections or suspicious logins', c:'sec'},
    {t:'Verify SAT training completion status for active users', c:'sec'},
    {t:'Confirm all Huntress agents are active and reporting', c:'sec'}
  ]},
  { title:'Freshdesk Tickets', pill:'TCKTS', pillClass:'pill-tkt', tasks:[
    {t:'Review and categorize all new / open tickets', c:'tkt'},
    {t:'Respond to or assign unacknowledged tickets', c:'tkt'},
    {t:'Follow up on pending / waiting tickets', c:'tkt'},
    {t:'Close resolved tickets with resolution notes', c:'tkt'}
  ]},
  { title:'Email', pill:'MAIL', pillClass:'pill-mail', tasks:[
    {t:'Process inbox — flag action items, archive noise', c:'log'},
    {t:'Respond to urgent client or vendor emails', c:'log'},
    {t:'Check for security alerts forwarded via email', c:'sec'}
  ]},
  { title:'Reports', pill:'RPT', pillClass:'pill-rep', tasks:[
    {t:'Generate any scheduled daily / weekly security reports', c:'rep'},
    {t:'Review and distribute client-facing reports if due', c:'rep'},
    {t:'Note anomalies or KPIs to flag or escalate', c:'rep'}
  ]},
  { title:'Security Updates', pill:'UPDT', pillClass:'pill-upd', tasks:[
    {t:'Review pending patch / update queue in Datto RMM', c:'sec'},
    {t:'Schedule or approve updates for eligible endpoints', c:'sec'},
    {t:'Confirm no updates are stuck or failed from prior run', c:'sec'}
  ]},
  { title:'MindSalt Logging', pill:'LOG', pillClass:'pill-log', tasks:[
    {t:'Log all ticket activity and resolutions worked today', c:'log'},
    {t:'Record time entries for each client / task', c:'log'},
    {t:'Add notes for any ongoing incidents or follow-ups', c:'log'}
  ]}
];

var TAGS   = {sec:'Security', tkt:'Tickets', rep:'Report', log:'Log'};
var TCLASS = {sec:'t-sec', tkt:'t-tkt', rep:'t-rep', log:'t-log'};
var CAT_LABEL = {general:'General', huntress:'Huntress', datto:'Datto', ticket:'Ticket'};
var CAT_CLASS = {general:'nc-general', huntress:'nc-huntress', datto:'nc-datto', ticket:'nc-ticket'};

var accessToken = null;
var currentUser = null;

// ---- Storage ----
function todayStr() { return new Date().toISOString().slice(0,10); }
function loadState() {
  try {
    var d = localStorage.getItem(DKEY), today = todayStr();
    if (d !== today) { localStorage.setItem(DKEY, today); localStorage.removeItem(SKEY); localStorage.removeItem(NKEY); return {}; }
    return JSON.parse(localStorage.getItem(SKEY)) || {};
  } catch(e) { return {}; }
}
function saveState(s) { try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch(e) {} }
function loadNotes()  { try { return JSON.parse(localStorage.getItem(NKEY)) || []; } catch(e) { return []; } }
function saveNotes(n) { try { localStorage.setItem(NKEY, JSON.stringify(n)); } catch(e) {} }
function fmtTime(ts) {
  var d = new Date(ts), h = d.getHours(), m = d.getMinutes();
  var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
}

var state = loadState();
var notes = loadNotes();
var total = 0;

// ---- Date ----
document.getElementById('dl').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

// ---- Build checklist immediately — no auth dependency ----
var app = document.getElementById('app');
for (var si = 0; si < DATA.length; si++) {
  var sec = DATA[si];
  total += sec.tasks.length;
  var wrap = document.createElement('div'); wrap.className = 'section';
  var hdr = document.createElement('div'); hdr.className = 'sec-hdr';
  var pill = document.createElement('span'); pill.className = 'sec-pill ' + sec.pillClass; pill.textContent = sec.pill;
  var titleEl = document.createElement('span'); titleEl.className = 'sec-title'; titleEl.textContent = sec.title;
  var badge = document.createElement('span'); badge.className = 'sec-badge'; badge.id = 'b' + si; badge.textContent = '0 / ' + sec.tasks.length;
  hdr.appendChild(pill); hdr.appendChild(titleEl); hdr.appendChild(badge);
  wrap.appendChild(hdr);
  for (var ti = 0; ti < sec.tasks.length; ti++) {
    (function(si, ti, task) {
      var id = 's' + si + 't' + ti;
      if (!(id in state)) state[id] = false;
      var row = document.createElement('div'); row.className = 'task';
      var cb = document.createElement('div'); cb.className = 'cb' + (state[id] ? ' on' : ''); cb.id = 'cb' + id;
      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','ck'); svg.setAttribute('width','10'); svg.setAttribute('height','10');
      svg.setAttribute('viewBox','0 0 10 10'); svg.setAttribute('fill','none');
      var path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d','M1.5 5L4 7.5L8.5 2.5'); path.setAttribute('stroke','#3ecf8e');
      path.setAttribute('stroke-width','2'); path.setAttribute('stroke-linecap','round'); path.setAttribute('stroke-linejoin','round');
      svg.appendChild(path); cb.appendChild(svg);
      var tt = document.createElement('span'); tt.className = 'tt' + (state[id] ? ' on' : ''); tt.id = 'tt' + id; tt.textContent = task.t;
      var tag = document.createElement('span'); tag.className = 'task-tag ' + TCLASS[task.c]; tag.textContent = TAGS[task.c];
      row.appendChild(cb); row.appendChild(tt); row.appendChild(tag);
      row.addEventListener('click', function() {
        state[id] = !state[id];
        document.getElementById('cb'+id).className = 'cb'+(state[id]?' on':'');
        document.getElementById('tt'+id).className = 'tt'+(state[id]?' on':'');
        updateBadge(si); updateProgress(); saveState(state);
      });
      wrap.appendChild(row);
    })(si, ti, sec.tasks[ti]);
  }
  app.appendChild(wrap);
  updateBadge(si);
}
updateProgress();

function updateBadge(si) {
  var sec = DATA[si], done = 0;
  for (var ti = 0; ti < sec.tasks.length; ti++) { if (state['s'+si+'t'+ti]) done++; }
  var b = document.getElementById('b'+si);
  b.textContent = done+' / '+sec.tasks.length;
  b.className = 'sec-badge'+(done===sec.tasks.length?' done':'');
}
function updateProgress() {
  var done = 0, keys = Object.keys(state);
  for (var i = 0; i < keys.length; i++) { if (state[keys[i]]) done++; }
  var pct = total > 0 ? Math.round(done/total*100) : 0;
  document.getElementById('pf').style.width = pct+'%';
  document.getElementById('pc').textContent = done+' / '+total;
}

// ---- Reset ----
document.getElementById('resetBtn').addEventListener('click', function() {
  if (!confirm('Reset all tasks and notes for today?')) return;
  var keys = Object.keys(state);
  for (var i = 0; i < keys.length; i++) {
    state[keys[i]] = false;
    var cb = document.getElementById('cb'+keys[i]); if (cb) cb.className = 'cb';
    var tt = document.getElementById('tt'+keys[i]); if (tt) tt.className = 'tt';
  }
  for (var si2 = 0; si2 < DATA.length; si2++) { updateBadge(si2); }
  updateProgress(); saveState(state);
  notes = []; saveNotes(notes); renderNotes();
});

// ---- Notes ----
function renderNotes() {
  var list = document.getElementById('notes-list');
  var countEl = document.getElementById('notes-count');
  list.innerHTML = '';
  countEl.textContent = notes.length+(notes.length===1?' note':' notes');
  if (notes.length === 0) {
    var empty = document.createElement('div'); empty.className = 'empty-notes';
    empty.textContent = 'No notes yet — log findings, ticket numbers, or follow-ups as you work.';
    list.appendChild(empty); return;
  }
  for (var i = notes.length-1; i >= 0; i--) {
    (function(idx) {
      var n = notes[idx];
      var row = document.createElement('div'); row.className = 'note-item';
      var timeEl = document.createElement('span'); timeEl.className = 'note-time'; timeEl.textContent = fmtTime(n.ts);
      var body = document.createElement('span'); body.className = 'note-body'; body.textContent = n.text;
      var cat = document.createElement('span'); cat.className = 'note-cat-badge '+CAT_CLASS[n.cat]; cat.textContent = CAT_LABEL[n.cat];
      var del = document.createElement('button'); del.className = 'note-del'; del.title = 'Delete'; del.textContent = '\u00d7';
      del.addEventListener('click', function() { notes.splice(idx,1); saveNotes(notes); renderNotes(); });
      row.appendChild(timeEl); row.appendChild(body); row.appendChild(cat); row.appendChild(del);
      list.appendChild(row);
    })(i);
  }
}

document.getElementById('note-add-btn').addEventListener('click', function() {
  var input = document.getElementById('note-input');
  var cat = document.getElementById('note-cat').value;
  var text = input.value.trim();
  if (!text) return;
  notes.push({text:text, cat:cat, ts:Date.now()});
  saveNotes(notes); renderNotes();
  input.value = ''; input.focus();
});

document.getElementById('note-input').addEventListener('keydown', function(e) {
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter') { document.getElementById('note-add-btn').click(); }
});

renderNotes();

// ---- MSAL auth — loads independently, does not block checklist ----
function initAuth() {
  try {
    var msalConfig = {
      auth: {
        clientId: CLIENT_ID,
        authority: 'https://login.microsoftonline.com/' + TENANT_ID,
        redirectUri: window.location.origin
      },
      cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
    };
    var msalInstance = new msal.PublicClientApplication(msalConfig);
    var loginRequest = { scopes: ['User.Read', 'Sites.ReadWrite.All', 'Files.ReadWrite.All'] };

    msalInstance.handleRedirectPromise().then(function(resp) {
      if (resp && resp.accessToken) { setUser(resp); return; }
      var accounts = msalInstance.getAllAccounts();
      if (accounts.length > 0) {
        msalInstance.acquireTokenSilent({ scopes: loginRequest.scopes, account: accounts[0] })
          .then(setUser)
          .catch(function() { msalInstance.loginRedirect(loginRequest); });
      } else {
        msalInstance.loginRedirect(loginRequest);
      }
    }).catch(function(e) {
      document.getElementById('user-name').textContent = 'Sign-in error';
      console.error('MSAL error', e);
    });

    window._msalInstance = msalInstance;
    window._loginRequest = loginRequest;
  } catch(e) {
    console.error('Auth init failed', e);
  }
}

function setUser(tokenResp) {
  accessToken = tokenResp.accessToken;
  var name = tokenResp.account.name || tokenResp.account.username || 'User';
  currentUser = name;
  var initials = name.split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
  document.getElementById('user-name').textContent = name;
  document.getElementById('user-avatar').textContent = initials;
  document.getElementById('saveBtn').disabled = false;
}

// Load MSAL from Microsoft CDN dynamically — won't block checklist if it fails
var msalScript = document.createElement('script');
msalScript.src = 'https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js';
msalScript.onload = function() { initAuth(); };
msalScript.onerror = function() {
  document.getElementById('user-name').textContent = 'Auth unavailable';
  console.warn('MSAL failed to load');
};
document.head.appendChild(msalScript);

// ---- Build log HTML ----
function buildLogHTML() {
  var today = new Date();
  var dateStr = today.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var timeStr = today.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  var done = 0, keys = Object.keys(state);
  for (var i = 0; i < keys.length; i++) { if (state[keys[i]]) done++; }
  var pct = total > 0 ? Math.round(done/total*100) : 0;
  var sectionsHTML = '';
  for (var si = 0; si < DATA.length; si++) {
    var sec = DATA[si], tasksHTML = '';
    for (var ti = 0; ti < sec.tasks.length; ti++) {
      var id = 's'+si+'t'+ti, checked = state[id];
      tasksHTML += '<tr style="border-bottom:1px solid #e5e7eb">'
        +'<td style="padding:8px 12px;width:24px;text-align:center;color:'+(checked?'#16a34a':'#9ca3af')+';font-size:16px">'+(checked?'&#10003;':'&#9675;')+'</td>'
        +'<td style="padding:8px 12px;font-size:13px;color:'+(checked?'#9ca3af':'#111827')+';'+(checked?'text-decoration:line-through':'')+'">'+ sec.tasks[ti].t +'</td>'
        +'<td style="padding:8px 12px;font-size:11px;color:#6b7280;font-family:monospace">'+TAGS[sec.tasks[ti].c]+'</td>'
        +'</tr>';
    }
    sectionsHTML += '<div style="margin-bottom:20px">'
      +'<div style="background:#f3f4f6;padding:8px 14px;border-radius:6px 6px 0 0;border:1px solid #e5e7eb;border-bottom:none">'
      +'<span style="font-family:monospace;font-size:10px;font-weight:700;color:#374151">'+sec.pill+'</span>'
      +'<span style="font-size:12px;font-weight:600;color:#374151;margin-left:10px">'+sec.title+'</span>'
      +'</div>'
      +'<table style="width:100%;border-collapse:collapse;border:1px solid #e5e7eb">'+tasksHTML+'</table>'
      +'</div>';
  }
  var notesHTML = notes.length > 0 ? (function(){
    var rows = '';
    for (var ni = 0; ni < notes.length; ni++) {
      var n = notes[ni];
      rows += '<tr style="border-bottom:1px solid #e5e7eb">'
        +'<td style="padding:8px 12px;font-size:11px;font-family:monospace;color:#2563eb;white-space:nowrap">'+fmtTime(n.ts)+'</td>'
        +'<td style="padding:8px 12px;font-size:13px;color:#111827">'+n.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</td>'
        +'<td style="padding:8px 12px;font-size:11px;font-family:monospace;color:#6b7280">'+CAT_LABEL[n.cat]+'</td>'
        +'</tr>';
    }
    return '<table style="width:100%;border-collapse:collapse;border:1px solid #e5e7eb">'+rows+'</table>';
  })() : '<p style="font-size:13px;color:#9ca3af;font-style:italic">No notes logged today.</p>';

  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Daily Log - '+(currentUser||'Unknown')+' - '+todayStr()+'</title></head>'
    +'<body style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;max-width:860px;margin:40px auto;padding:0 24px;color:#111827">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid #111827">'
    +'<div><div style="font-family:monospace;font-size:11px;color:#6b7280;text-transform:uppercase;margin-bottom:4px">Xynergie Corp</div>'
    +'<div style="font-size:22px;font-weight:700">Daily Ops Log</div>'
    +'<div style="font-size:13px;color:#6b7280;margin-top:4px">'+dateStr+'</div></div>'
    +'<div style="text-align:right"><div style="font-size:14px;font-weight:600">'+(currentUser||'Unknown')+'</div>'
    +'<div style="font-size:12px;color:#6b7280;margin-top:2px">Saved at '+timeStr+'</div>'
    +'<div style="margin-top:8px;background:#f3f4f6;border-radius:6px;padding:6px 14px;text-align:center">'
    +'<span style="font-size:20px;font-weight:700">'+pct+'%</span>'
    +'<div style="font-size:11px;color:#6b7280">'+done+' of '+total+' tasks</div></div></div></div>'
    +sectionsHTML
    +'<h3 style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#374151;margin:24px 0 12px">Notes</h3>'
    +notesHTML+'</body></html>';
}

// ---- Save to SharePoint ----
document.getElementById('saveBtn').addEventListener('click', function() {
  if (!accessToken) { setStatus('Not signed in to M365.', 'err'); return; }
  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setStatus('Saving to SharePoint...', 'ing');
  var safeName = (currentUser||'unknown').replace(/[^a-zA-Z0-9]/g,'-');
  var fileName = todayStr()+'-'+safeName+'.html';
  var content = buildLogHTML();
  var siteHostname = SITE_URL.replace('https://','').split('/')[0];
  var sitePath = SITE_URL.replace('https://'+siteHostname,'');
  fetch('https://graph.microsoft.com/v1.0/sites/'+siteHostname+':'+sitePath, {
    headers:{'Authorization':'Bearer '+accessToken}
  })
  .then(function(r){return r.json();})
  .then(function(site){
    if (!site.id) throw new Error('SharePoint site not found.');
    return fetch(
      'https://graph.microsoft.com/v1.0/sites/'+site.id+'/drive/root:/'+encodeURIComponent(FOLDER_PATH)+'/'+encodeURIComponent(fileName)+':/content',
      {method:'PUT', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'text/html'}, body:content}
    );
  })
  .then(function(r){return r.json();})
  .then(function(file){
    if (file.id) { setStatus('Saved: '+fileName, 'ok'); }
    else { throw new Error(file.error ? file.error.message : 'Upload failed'); }
  })
  .catch(function(err){ setStatus('Error: '+err.message, 'err'); })
  .finally(function(){ btn.disabled = false; });
});

function setStatus(msg, type) {
  var el = document.getElementById('save-status');
  el.textContent = msg; el.className = 'save-status '+type;
}
</script>
